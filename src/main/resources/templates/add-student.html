<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - Student Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Header / Navigation -->
<div th:replace="~{fragments/layout :: navbar('add')}"></div>

<div class="main-content container py-4">

    <!-- Error Alert Message -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <strong th:text="${errorMessage}">Validation Error</strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card shadow-sm p-4">
                <div class="d-flex align-items-center gap-3 border-bottom pb-3 mb-4">
                    <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-0">Add New Student</h3>
                        <p class="text-muted mb-0 small">Enter student credentials to store in the system.</p>
                    </div>
                </div>

                <form th:action="@{/students/add}" th:object="${studentForm}" method="post">
                    
                    <div class="row g-3">
                        <!-- Student ID -->
                        <div class="col-md-6">
                            <label for="id" class="form-label fw-semibold">
                                Student ID <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-card-heading"></i></span>
                                <input type="number" id="id" name="id" class="form-control"
                                       th:field="*{id}" placeholder="e.g. 106" min="1" required>
                            </div>
                            <div class="form-text">Must be a unique positive whole number.</div>
                        </div>

                        <!-- Age -->
                        <div class="col-md-6">
                            <label for="age" class="form-label fw-semibold">
                                Age <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
                                <input type="number" id="age" name="age" class="form-control"
                                       th:field="*{age}" placeholder="e.g. 20" min="1" max="120" required>
                            </div>
                            <div class="form-text">Allowed age range: 1 to 120.</div>
                        </div>

                        <!-- Full Name -->
                        <div class="col-12">
                            <label for="name" class="form-label fw-semibold">
                                Student Full Name <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" id="name" name="name" class="form-control"
                                       th:field="*{name}" placeholder="e.g. Sophia Miller" required>
                            </div>
                            <div class="form-text">Name cannot be empty.</div>
                        </div>

                        <!-- Course -->
                        <div class="col-md-7">
                            <label for="course" class="form-label fw-semibold">
                                Course / Department <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-book"></i></span>
                                <input type="text" id="course" name="course" class="form-control"
                                       th:field="*{course}" placeholder="e.g. Computer Science" list="courseSuggestions" required>
                                <datalist id="courseSuggestions">
                                    <option value="Computer Science">
                                    <option value="Information Technology">
                                    <option value="Data Science">
                                    <option value="Cyber Security">
                                    <option value="Artificial Intelligence">
                                    <option value="Electronics & Communication">
                                    <option value="Mechanical Engineering">
                                </datalist>
                            </div>
                            <div class="form-text">Select or type the student's department.</div>
                        </div>

                        <!-- Marks -->
                        <div class="col-md-5">
                            <label for="marks" class="form-label fw-semibold">
                                Marks (0 - 100) <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-award"></i></span>
                                <input type="number" id="marks" name="marks" class="form-control"
                                       th:field="*{marks}" placeholder="e.g. 85.5" min="0" max="100" step="0.1" required>
                                <span class="input-group-text bg-light">
                                    Grade: <span id="gradePreview" class="badge bg-secondary ms-1">--</span>
                                </span>
                            </div>
                            <div class="form-text">Grading: 90+ A+, 80+ A, 70+ B, 60+ C, 40+ D, &lt;40 F</div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <a th:href="@{/students}" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-x-circle me-1"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary px-4 shadow-sm">
                            <i class="bi bi-check2-circle me-1"></i> Save Student Record
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

</div>

<!-- Footer -->
<div th:replace="~{fragments/layout :: footer}"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script th:src="@{/js/main.js}"></script>
</body>
</html>
