<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Header / Navigation Fragment -->
<div th:fragment="navbar(activeTab)">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <i class="bi bi-mortarboard-fill fs-4"></i>
                <span>College SMS</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeTab == 'home' ? 'active fw-bold' : ''}" th:href="@{/}">
                            <i class="bi bi-speedometer2 me-1"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeTab == 'students' ? 'active fw-bold' : ''}" th:href="@{/students}">
                            <i class="bi bi-people-fill me-1"></i> All Students
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeTab == 'add' ? 'active fw-bold' : ''}" th:href="@{/students/add}">
                            <i class="bi bi-person-plus-fill me-1"></i> Add Student
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeTab == 'report' ? 'active fw-bold' : ''}" th:href="@{/report}">
                            <i class="bi bi-bar-chart-line-fill me-1"></i> Class Report
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center text-white-50 small">
                    <span class="badge bg-light text-primary me-2"><i class="bi bi-cpu me-1"></i> Java Full-Stack</span>
                    <span>Spring Boot &bull; Thymeleaf</span>
                </div>
            </div>
        </div>
    </nav>
</div>

<!-- Footer Fragment -->
<div th:fragment="footer">
    <footer class="footer">
        <div class="container text-center">
            <p class="mb-1 text-white">Student Management System &mdash; Pure Java Full-Stack Edition</p>
            <p class="small mb-0 text-muted">College Final-Year Project &bull; Powered by Spring Boot, Thymeleaf & Bootstrap</p>
        </div>
    </footer>
</div>

</body>
</html>
